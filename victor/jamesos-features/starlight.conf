# JamesOS starlight eyes settings
# Change a number, then run:  ./jamesos.sh starlight on
# Vector picks up the change in about 2 seconds (no rebuild, no restart).

# 1 = on, 0 = off
enabled=1

# how many sparkles can be in his eyes at the same time (0-20)
stars=3

# how often a new sparkle appears (0.01 = rare, 0.04 = sometimes, 0.2 = a lot)
chance=0.04

# how long one sparkle lasts, in frames (30 frames = 1 second)
life=24

# sparkle size (1 = tiny, 4 = big)
size=2

# sparkle color as red,green,blue (0-255). 255,255,255 = white
color=255,255,255
